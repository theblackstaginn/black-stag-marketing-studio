<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>E-Shop Bridge | Black Stag</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#171b18;color:#eee4d2;font:16px/1.6 system-ui,sans-serif;padding:20px}
main{max-width:530px;background:#242c25;border:1px solid #927a50;border-radius:18px;padding:30px}
h1{font:36px/1.2 Georgia,serif;margin:12px 0}
small{letter-spacing:.2em;text-transform:uppercase;color:#c8aa76}
p{color:#bcb5a6}
button{background:#bd995e;color:#141814;padding:15px 22px;border:0;border-radius:8px;font-weight:700;width:100%;cursor:pointer}
button:disabled{opacity:.45;cursor:default}#desk{display:block;width:100%;text-align:center;background:#b99766;color:#1c2119;border-radius:9px;padding:14px 18px;text-decoration:none;font-weight:700;margin-top:14px}#desk[hidden]{display:none}#desk:hover{background:#d0b280}
#status{padding:14px;background:#111712;border-radius:8px;margin:22px 0}
a{color:#d1b581}
</style>
</head>
<body>
<main>
<small>Black Stag E-Shop Bridge</small>
<h1>Lace &amp; Leather Arcane</h1>
<p>Your shop is already connected for reporting. You can also grant listing editing permission. Granting access alone will not change listings, digital downloads or orders.</p>
<div id="status" role="status" aria-live="polite">Checking account...</div>
<button id="connect" disabled>Connect LaceLeatherArcane</button>
<a id="desk" href="./etsy-dashboard.html" hidden>Open Etsy Sales Desk &rarr;</a>
<p><a href="./">Return to Marketing Studio</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(async()=>{
 const ui=document.getElementById("status"),btn=document.getElementById("connect");
 const config=window.BLACK_STAG_CONFIG?.supabase;
 if(!config?.url||!config?.publishableKey||!window.supabase){ui.textContent="Studio configuration unavailable";return}
 const client=window.supabase.createClient(config.url,config.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 async function api(action){
  ui.textContent="Checking Marketing Studio sign-in...";
  let sessionTimer;
  let data;
  try{
   ({data}=await Promise.race([
    client.auth.getSession(),
    new Promise((_,reject)=>{sessionTimer=setTimeout(()=>reject(Error("Studio session check timed out. Refresh this page and try again.")),15000)})
   ]));
  }finally{clearTimeout(sessionTimer)}
  const jwt=data?.session?.access_token;
  if(!jwt)throw Error("Sign in to Marketing Studio first, then return here.");
  ui.textContent=action==="start"?"Requesting a fresh authorization link...":"Checking secure bridge...";
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),15000);
  let response;
  try{
   response=await fetch(config.url+"/functions/v1/etsy-oauth-callback",{
    method:"POST",headers:{"Content-Type":"application/json","apikey":config.publishableKey,"Authorization":"Bearer "+jwt},
    body:JSON.stringify({action}),signal:controller.signal
   });
  }catch(error){
   if(error?.name==="AbortError")throw Error("Secure bridge took too long to respond.");
   throw Error("Unable to reach the secure bridge.");
  }finally{clearTimeout(timeout)}
  const result=await response.json();
  if(!response.ok)throw Error(result.error||"Secure bridge request failed");
  return result;
 }
 btn.onclick=async()=>{
  btn.disabled=true;ui.textContent="Preparing secure authorization...";
  try{
   const result=await api("start");
   if(!result.authorize_url?.startsWith("https://www.etsy.com/oauth/connect?"))throw Error("Invalid Etsy authorization link");
   location.assign(result.authorize_url);
  }catch(error){ui.textContent=error.message;btn.disabled=false}
 };
 try{
  const current=await api("status");
  if(current.connected){
   document.getElementById("desk").hidden=false;
   if(current.can_edit){
    ui.textContent="Connected: "+current.shop.shop_name+" · Listing editing authorized.";
    btn.disabled=true;
    btn.textContent="Editing access enabled";
   }else{
    ui.textContent="Connected: "+current.shop.shop_name+" · Read-only. Grant permission to edit titles, tags, descriptions, prices and digital files.";
    btn.disabled=false;
    btn.textContent="Grant listing editing access";
   }
   return;
  }
  if(!current.configured){ui.textContent="Private server credentials are not configured yet.";return}
  ui.textContent="Ready to authorize with Etsy.";
  btn.disabled=false;
 }catch(error){ui.textContent=error.message}
})();
</script>
</body></html>
